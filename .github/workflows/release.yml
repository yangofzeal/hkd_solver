name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade setuptools wheel
          python setup.py sdist bdist_wheel
          ls -lh dist
          unzip -l dist/*.whl

      - name: Test wheel
        run: |
          python -m venv /tmp/hkdtest
          /tmp/hkdtest/bin/python -m pip install dist/*.whl
          /tmp/hkdtest/bin/python -c "import hkd_solver; print(hkd_solver.__file__); print('HKD_SOLVER_GITHUB_TEST_PASS')"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
